# EasyCopy – przykładowa konfiguracja Docker Compose.
#
# Start:        docker compose up -d
# Panel:        http://<adres-serwera>:8080/
# Archiwa:      http://<adres-serwera>:8081/
# Kopia z CLI:  docker compose exec easycopy easycopy https://www.example.com/

services:
  easycopy:
    # do czasu wydania 0.1.0 dostępny jest tylko tag „edge” (bieżąca gałąź main);
    # po wydaniu zmień na :latest albo konkretną wersję, np. :0.1.0
    image: ghcr.io/gadziunet/easycopy:edge
    # albo zbuduj obraz lokalnie z tego repozytorium:
    # build: .
    container_name: easycopy
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"   # panel
      - "8081:8081"   # archiwa (osobny port = osobne źródło, bezpieczniej)
    environment:
      # użytkownik, jako który zapisywane są pliki (Unraid: PUID=99, PGID=100)
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      # hasła – odkomentuj, żeby włączyć (przy archiwach nazwa użytkownika dowolna)
      # - PANEL_PASSWORD=zmien-to-haslo
      # - ARCHIVE_PASSWORD=zmien-to-haslo
      # adres archiwów w linkach panelu, gdy oba porty są za reverse proxy:
      # - ARCHIVE_BASE_URL=https://archiwa.example.com
    volumes:
      - ./data:/data
      # Unraid: dane aplikacji na cache, a duże archiwa na macierzy, np.:
      # - /mnt/cache/appdata/easycopy:/data
      # - /mnt/user/archiwa-www:/data/archiwa
