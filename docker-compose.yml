# EasyCopy – example Docker Compose configuration.
#
# Start:          docker compose up -d
# Panel:          http://<server-address>:8080/
# Archives:       http://<server-address>:8081/
# Copy from CLI:  docker compose exec easycopy easycopy https://www.example.com/

services:
  easycopy:
    # until 0.1.0 is released only the "edge" tag exists (current main branch);
    # after the release switch to :latest or a specific version, e.g. :0.1.0
    image: ghcr.io/gadziunet/easycopy:edge
    # or build the image locally from this repository:
    # build: .
    container_name: easycopy
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"   # panel
      - "8081:8081"   # archives (separate port = separate origin, safer)
    environment:
      # user that owns the saved files (Unraid: PUID=99, PGID=100)
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      # default language of the panel: en or pl (otherwise the browser language)
      # - EASYCOPY_LANG=en
    volumes:
      - ./data:/data
      # Unraid: app data on the cache pool, large archives on the array, e.g.:
      # - /mnt/cache/appdata/easycopy:/data
      # - /mnt/user/web-archives:/data/archiwa
